<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Life OS — Today</title>
  <style>
/* Personal Life OS — Phase 2 UI
   Direction: Linear precision × Apple calm. Dark-first, minimal, personal.
   Signature: the live "today" instrument — big date, mono clock, progress ring.
   Palette avoids the usual AI defaults: cool graphite surfaces + a restrained
   periwinkle-indigo accent, with a mono face carrying all the numerics. */

:root {
  --accent: #6e7bf2;
  --accent-2: #8a94f5;
  --good: #37d399;
  --warn: #e0a85b;
  --urgent: #f26d6d;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono",
    Menlo, Consolas, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --sidebar-w: 240px;
  --maxw: 1160px;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 8px 30px rgba(0, 0, 0, 0.18);
}

/* Dark (default) */
:root,
[data-theme="dark"] {
  --bg: #0b0c0e;
  --bg-grad: radial-gradient(1200px 600px at 78% -10%, rgba(110, 123, 242, 0.10), transparent 60%);
  --surface: #131519;
  --surface-2: #191c22;
  --surface-hi: #1f232a;
  --border: rgba(255, 255, 255, 0.08);
  --border-hi: rgba(255, 255, 255, 0.14);
  --text: #eceef1;
  --text-dim: #9aa1ab;
  --text-faint: #676e79;
  --track: rgba(255, 255, 255, 0.09);
}

[data-theme="light"] {
  --bg: #f7f8fa;
  --bg-grad: radial-gradient(1200px 600px at 78% -10%, rgba(110, 123, 242, 0.12), transparent 60%);
  --surface: #ffffff;
  --surface-2: #ffffff;
  --surface-hi: #f1f2f6;
  --border: rgba(15, 18, 25, 0.10);
  --border-hi: rgba(15, 18, 25, 0.16);
  --text: #14171c;
  --text-dim: #5a616c;
  --text-faint: #8a919c;
  --track: rgba(15, 18, 25, 0.08);
  --shadow: 0 1px 2px rgba(15, 18, 25, 0.06), 0 10px 30px rgba(15, 18, 25, 0.07);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--text);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 22px 16px;
  border-right: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 55%, transparent);
  backdrop-filter: blur(12px);
}

.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand-dot {
  width: 14px; height: 14px; border-radius: 5px;
  background: linear-gradient(140deg, var(--accent-2), var(--accent));
  box-shadow: 0 0 16px rgba(110, 123, 242, 0.5);
}
.brand-name { font-weight: 600; letter-spacing: -0.01em; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--text-dim); text-decoration: none; font-size: 14px;
  cursor: default; user-select: none;
}
.nav-item.is-active {
  color: var(--text); background: var(--surface-hi);
  box-shadow: inset 0 0 0 1px var(--border);
}
.nav-item.is-soon { opacity: 0.75; }
.soon {
  font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text-faint); border: 1px solid var(--border);
  padding: 1px 6px; border-radius: 999px;
}

.sidebar-foot { margin-top: auto; }
.theme-btn {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: var(--r-sm);
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); font-size: 13px; cursor: pointer;
}
.theme-btn:hover { color: var(--text); border-color: var(--border-hi); }
.theme-glyph { font-size: 14px; }

/* ---------- Main column ---------- */
.maincol { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(12px);
}
.menu-btn {
  display: none; background: transparent; border: 1px solid var(--border);
  color: var(--text); border-radius: var(--r-sm); width: 38px; height: 38px;
  font-size: 16px; cursor: pointer;
}

.quickadd {
  display: flex; align-items: center; gap: 8px; width: 100%;
  max-width: var(--maxw); margin: 0 auto;
}
.segmented { display: flex; padding: 3px; gap: 3px; background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 10px; }
.seg {
  border: 0; background: transparent; color: var(--text-dim);
  font-size: 13px; padding: 6px 12px; border-radius: 7px; cursor: pointer;
}
.seg.is-active { background: var(--surface-hi); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.2); }

.qa-input {
  flex: 1; min-width: 0; height: 40px; padding: 0 14px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: var(--font-sans);
}
.qa-input::placeholder { color: var(--text-faint); }
.qa-input:focus { outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(110, 123, 242, 0.22); }

.btn { border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text); border-radius: 10px; padding: 0 16px; height: 40px;
  font-size: 14px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--border-hi); }
.btn-primary { background: linear-gradient(140deg, var(--accent-2), var(--accent));
  border-color: transparent; color: #fff;
  box-shadow: 0 4px 16px rgba(110, 123, 242, 0.35); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: transparent; }

.content {
  flex: 1; width: 100%; max-width: var(--maxw);
  margin: 0 auto; padding: 28px 24px 64px;
}
.dash { display: flex; flex-direction: column; gap: 22px; }

/* ---------- Hero (signature) ---------- */
.hero {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 26px 28px; border-radius: var(--r-lg);
  background: linear-gradient(160deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.greeting { color: var(--text-dim); font-size: 14px; letter-spacing: 0.01em; }
.date { margin: 4px 0 8px; font-size: 34px; line-height: 1.05;
  font-weight: 600; letter-spacing: -0.02em; }
.clock { font-size: 15px; color: var(--text-faint); letter-spacing: 0.06em; }

.hero-right { display: flex; align-items: center; gap: 22px; }
.ring { position: relative; width: 116px; height: 116px; flex: none; }
.ring svg { width: 116px; height: 116px; display: block; }
.ring-track { stroke: var(--track); }
.ring-value { stroke: url(#g) ; stroke: var(--accent);
  transition: stroke-dashoffset 700ms cubic-bezier(0.22, 1, 0.36, 1); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; }
.ring-pct { font-family: var(--font-mono); font-size: 26px; font-weight: 600;
  letter-spacing: -0.02em; }
.ring-pct i { font-style: normal; font-size: 13px; color: var(--text-dim);
  margin-left: 1px; }
.ring-sub { font-size: 11px; color: var(--text-faint); text-transform: uppercase;
  letter-spacing: 0.08em; }
.hero-stats { display: flex; flex-direction: column; gap: 12px; }
.stat { display: flex; flex-direction: column; }
.stat-num { font-size: 20px; font-weight: 600; }
.stat-lbl { font-size: 12px; color: var(--text-faint); }

/* ---------- Cards grid ---------- */
.grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: 18px 18px 14px;
  box-shadow: var(--shadow); min-width: 0;
}
.card-priorities { grid-column: 1 / -1;
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 9%, var(--surface)), var(--surface)); }
.card-head { display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px; }
.card-head h2 { margin: 0; font-size: 13px; font-weight: 600;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-dim); }
.card-count { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); }

.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 4px;
  border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row-main { min-width: 0; flex: 1; }
.row-title-line { display: flex; align-items: center; gap: 8px; }
.row-title { font-size: 14.5px; }
.row.is-done .row-title { color: var(--text-faint); text-decoration: line-through; }
.row-meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }

.pill { font-size: 11px; padding: 1px 8px; border-radius: 999px;
  color: var(--text-dim); border: 1px solid var(--border); }
.pill-soft { color: var(--text-faint); }
.pill-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.prio-urgent { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 45%, transparent); }
.prio-high { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.prio-medium { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.prio-low { color: var(--text-faint); }

/* check control */
.check { flex: none; width: 22px; height: 22px; border-radius: 7px;
  border: 1.5px solid var(--border-hi); background: transparent; cursor: pointer;
  position: relative; transition: border-color 120ms, background 120ms; }
.check:hover { border-color: var(--accent); }
.check[aria-pressed="true"] { background: var(--good); border-color: var(--good); }
.check[aria-pressed="true"]::after { content: "✓"; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #04110b; font-weight: 700; }

/* habits */
.habit .row-main { display: flex; flex-direction: column; gap: 6px; }
.habit-measure { display: flex; align-items: center; gap: 10px; flex: none; }
.habit-count { font-size: 13px; color: var(--text-dim); }
.step-btn { min-width: 40px; height: 30px; border-radius: 8px;
  border: 1px solid var(--border-hi); background: var(--surface-2);
  color: var(--text); font-size: 13px; cursor: pointer; }
.step-btn:hover { border-color: var(--accent); }
.streak { font-size: 11px; color: var(--warn); }

.hbar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.hbar > i { display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 500ms cubic-bezier(0.22, 1, 0.36, 1); }

/* routines */
.routines { display: flex; flex-direction: column; gap: 16px; }
.routine-group { display: flex; flex-direction: column; gap: 10px; }
.routine-bucket { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-faint); }
.routine { display: flex; flex-direction: column; gap: 8px; padding: 12px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface-2); }
.routine-head { display: flex; align-items: baseline; justify-content: space-between; }
.routine-name { font-size: 14px; font-weight: 500; }
.routine-frac { font-size: 12px; color: var(--text-faint); }
.routine-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
  border-radius: 999px; border: 1px solid var(--border-hi);
  background: transparent; color: var(--text-dim); font-size: 12.5px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--text); }
.chip.is-done { background: color-mix(in srgb, var(--good) 16%, transparent);
  border-color: color-mix(in srgb, var(--good) 45%, transparent); color: var(--text); }
.chip-check { width: 12px; text-align: center; color: var(--good); font-weight: 700; }

/* goals */
.goals { display: flex; flex-direction: column; gap: 14px; }
.goal { display: flex; flex-direction: column; gap: 6px; }
.goal-head { display: flex; align-items: baseline; justify-content: space-between; }
.goal-horizon { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint); }
.goal-pct { font-size: 12px; color: var(--text-dim); }
.goal-name { font-size: 14px; }
.gbar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.gbar > i { display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--good), #6fe6b8);
  transition: width 600ms cubic-bezier(0.22, 1, 0.36, 1); }

/* empty states */
.empty-line { color: var(--text-faint); font-size: 13.5px; margin: 4px 2px 8px;
  line-height: 1.5; }
.empty-hero { text-align: center; padding: 64px 24px;
  border: 1px dashed var(--border-hi); border-radius: var(--r-lg);
  background: var(--surface); }
.empty-mark { font-size: 40px; color: var(--accent); opacity: 0.8; }
.empty-hero h2 { margin: 12px 0 6px; font-size: 20px; letter-spacing: -0.01em; }
.empty-hero p { margin: 0 auto 20px; max-width: 380px; color: var(--text-dim);
  font-size: 14px; line-height: 1.55; }
.empty-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* scrim for mobile drawer */
.scrim { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 50; width: 264px;
    transform: translateX(-100%); transition: transform 240ms cubic-bezier(0.22,1,0.36,1);
    background: var(--surface);
  }
  .app.sidebar-open .sidebar { transform: translateX(0); }
  .app.sidebar-open .scrim { display: block; position: fixed; inset: 0; z-index: 40;
    background: rgba(0, 0, 0, 0.5); }
  .menu-btn { display: inline-flex; align-items: center; justify-content: center; }
  .grid { grid-template-columns: 1fr; }
  .card-priorities { grid-column: auto; }
}

@media (max-width: 560px) {
  .topbar { padding: 12px 14px; }
  .content { padding: 18px 14px 56px; }
  .hero { flex-direction: column; align-items: flex-start; gap: 18px; padding: 20px; }
  .hero-right { align-self: stretch; justify-content: space-between; }
  .date { font-size: 27px; }
  .segmented { display: none; } /* on phones Quick Add defaults to Task */
  .qa-input { height: 42px; }
}

/* accessibility */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* thin, quiet scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border-hi) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 999px;
  border: 3px solid transparent; background-clip: content-box; }

/* ============================================================
   Phase 3 — module pages, forms, and the Today module card
   ============================================================ */

/* Nav items no longer use a "Soon" pill; keep hover affordance */
.nav-item { cursor: pointer; }

/* Page header for module pages */
.page-head { margin: 4px 2px 20px; }
.page-title {
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -0.02em;
  margin: 0;
}
.page-sub { color: var(--text-dim); margin: 4px 0 0; font-size: 14px; }

/* Wide cards span the full grid width */
.card-wide { grid-column: 1 / -1; }

/* Stat rows */
.stat-row {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
}
.stat-row.tight { gap: 20px; margin-top: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-value {
  font-size: 22px;
  font-weight: 650;
  font-family: var(--font-mono);
  letter-spacing: -0.01em;
}
.stat-label { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.muted { color: var(--text-dim); font-size: 13px; margin: 10px 0 0; }

/* Generic horizontal bar (progress) */
.bar {
  display: block;
  height: 8px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}
.bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.4s ease;
}

/* Progress block: label row + bar */
.prog { margin: 12px 0; }
.prog:first-child { margin-top: 0; }
.prog-head {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 6px;
}

/* Forms */
.form { margin: 12px 0 4px; }
.form + .form { border-top: 1px solid var(--border); padding-top: 14px; }
.form-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
}
.fld { display: flex; flex-direction: column; gap: 5px; flex: 1 1 120px; min-width: 90px; }
.fld-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.fld-input {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.fld-input:focus {
  border-color: var(--border-hi);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.form-actions { margin-top: 12px; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 12px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.pill {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11px;
  color: var(--text-dim);
  text-transform: capitalize;
}
.pill-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }

/* Generic rows reused across modules */
.pr-row .row-meta, .mono { font-family: var(--font-mono); }
.row.is-dim { opacity: 0.5; }

/* Workout sessions */
.session {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 12px;
  background: var(--surface-2);
}
.session-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.session-head .row-title { font-weight: 600; }
.session-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.session.is-active { border-color: color-mix(in srgb, var(--accent) 30%, var(--border)); }
.session-summary { color: var(--text-dim); font-size: 12px; margin: -4px 0 12px; }

.se-block { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.se-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.se-head .row-title { font-weight: 550; }
.se-tag {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-faint); border: 1px solid var(--border);
  border-radius: 999px; padding: 2px 8px;
}
.se-count { margin-left: auto; color: var(--text-faint); font-size: 12px; }

/* Clean per-set rows: "Set 1 · 12 × 60 kg" */
.set-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.set-row {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 10px; background: var(--surface); border-radius: var(--r-sm);
}
.set-n { color: var(--text-faint); font-size: 12px; min-width: 44px; }
.set-val { flex: 1; font-size: 14px; }

/* Quiet "add exercise" — collapsed by default, not a prominent card */
.add-ex { margin-top: 12px; }
.add-ex > summary {
  cursor: pointer; color: var(--text-dim); font-size: 13px;
  list-style: none; padding: 4px 0; user-select: none;
}
.add-ex > summary::-webkit-details-marker { display: none; }
.add-ex > summary:hover { color: var(--text); }
.add-ex[open] > summary { color: var(--text); margin-bottom: 4px; }

/* Finish is the clear final action */
.finish-row { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.btn-finish { width: 100%; padding: 11px; font-weight: 600; font-size: 15px; }

/* Routines admin */
.routine-admin {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 12px;
  background: var(--surface-2);
}

/* Reading items */
.read-item {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 12px;
  background: var(--surface-2);
}
.read-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.read-head .row-title { font-weight: 600; }
.read-actions { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px; }
.read-actions .form { margin: 0; }
.read-actions .form + .form { border: 0; padding: 0; }

/* Today: "Across your day" module card */
.card-modules .mod-chips {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}
.mod-chip {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 12px;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.1s ease;
}
.mod-chip:hover { border-color: var(--border-hi); transform: translateY(-1px); }
.mod-chip-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.mod-chip-value { font-size: 15px; font-weight: 600; font-family: var(--font-mono); }
.mod-bar {
  display: block; height: 5px; border-radius: 999px; background: var(--track); overflow: hidden;
}
.mod-bar-fill {
  display: block; height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

/* ============================================================
   Phase 4 — plan/reflect pages (Goals, Tasks, Projects,
   Journal, Settings) + grouped sidebar navigation
   ============================================================ */

/* Grouped nav */
.nav-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.nav-heading {
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-faint); padding: 8px 12px 4px;
}

/* Wide form field (textarea rows) */
.fld-wide { flex: 1 1 100%; }
textarea.fld-input { resize: vertical; min-height: 44px; font-family: inherit; line-height: 1.45; }

/* Tabs (task filters) */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab {
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-dim); border-radius: 999px; padding: 6px 13px;
  font-size: 13px; cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.tab:hover { border-color: var(--border-hi); color: var(--text); }
.tab.is-active { background: color-mix(in srgb, var(--accent) 18%, transparent);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: var(--text); }

/* Priority pills */
.pill-low { color: var(--text-dim); }
.pill-medium { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.pill-high { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
.pill-urgent { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 50%, var(--border)); }

/* Reusable checkbox control (milestones, subtasks, project tasks) */
.check {
  width: 20px; height: 20px; flex: none; border-radius: 6px;
  border: 1.5px solid var(--border-hi); background: var(--surface-2);
  cursor: pointer; position: relative; transition: border-color 120ms, background 120ms;
}
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-pressed="true"]::after {
  content: "✓"; position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 12px; color: #fff;
}
.check-sm { width: 16px; height: 16px; border-radius: 5px; }
.is-done { text-decoration: line-through; color: var(--text-faint); }

/* Goals — collapsed summary card that expands to reveal controls */
.goal-tree { gap: 10px; }
.goal-node {
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2); overflow: hidden;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.goal-node.is-open { border-color: var(--border-hi); }
.goal-node.just-saved {
  border-color: var(--good);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent);
}

.goal-summary {
  display: flex; flex-direction: column; gap: 8px; width: 100%;
  text-align: left; background: transparent; border: 0; cursor: pointer;
  padding: 14px 16px; color: var(--text);
}
.goal-summary:hover { background: var(--surface-hi); }
.goal-summary-top { display: flex; align-items: center; gap: 10px; }
.goal-summary-top .chevron { color: var(--text-faint); font-size: 12px; width: 12px; }
.goal-title { font-weight: 600; font-size: 15px; flex: 1; }
.goal-summary-pct { color: var(--text-dim); font-size: 13px; }
.goal-summary-meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-dim); }
.goal-summary-meta .muted-inline { color: var(--text-faint); }
.status-completed { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
.status-on_hold { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
.status-archived { color: var(--text-faint); }

.goal-details {
  border-top: 1px solid var(--border);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
}
/* Expanded goal: labelled sections instead of stacked forms */
.goal-section { margin-bottom: 4px; }
.goal-section + .goal-section { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
.goal-section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.goal-section-title {
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint);
}
.goal-section .form { margin: 8px 0 0; }
.goal-section .form-row { align-items: flex-end; }

/* Next-incomplete milestone hint on the collapsed summary */
.next-ms { color: var(--accent); font-size: 12px; }

/* Highlight the next milestone in the expanded list */
.ms-row.is-next .ms-title { color: var(--text); font-weight: 550; }
.ms-row.is-next { position: relative; }

/* Small icon-only button (remove milestone, delete goal) */
.icon-btn {
  background: transparent; border: 0; color: var(--text-faint); cursor: pointer;
  padding: 4px 6px; border-radius: var(--r-sm); font-size: 13px; transition: color 0.12s, background 0.12s;
}
.icon-btn:hover { color: var(--text); background: var(--surface-hi); }
.danger-link { color: var(--text-dim); }
.danger-link:hover { color: var(--urgent); background: color-mix(in srgb, var(--urgent) 12%, transparent); }

/* One-click status pills (replaces the status form) */
.status-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.status-pill {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.status-pill:hover { border-color: var(--border-hi); color: var(--text); }
.status-pill.is-active {
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: var(--text);
}
.goal-danger { margin-top: 6px; }

.milestones, .subtasks { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 10px; }
.ms-row { display: flex; align-items: center; gap: 10px; }
.ms-title { flex: 1; font-size: 14px; }

/* Today: goal rows are now clickable links into the Goals page */
.goal-link {
  width: 100%; text-align: left; background: transparent; border: 0;
  cursor: pointer; padding: 8px; margin: -8px; border-radius: var(--r-sm);
  color: inherit; font: inherit; transition: background 0.12s ease;
}
.goal-link:hover { background: var(--surface-hi); }


/* Tasks */
.task-block { border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 12px 14px; background: var(--surface-2); margin-bottom: 10px; }
.task-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.task-line .row-title { font-weight: 550; }
.task-actions { margin-left: auto; }
.task-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
  border-top: 1px solid var(--border); padding-top: 12px; }
.task-controls .form { margin: 0; }
.task-controls .form + .form { border: 0; padding: 0; }
.task-controls .fld { flex: 0 1 auto; min-width: 84px; }

/* Projects */
.project-block { border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 14px; background: var(--surface-2); margin-bottom: 12px; }

/* Journal */
.journal-day { border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 14px; background: var(--surface-2); margin-bottom: 10px; }
.jr-line { margin: 6px 0; font-size: 14px; color: var(--text); }
.jr-line b { color: var(--text-dim); font-weight: 600; }

/* Readable saved-review content (Today's Review + Past reviews) */
.jr-review { display: flex; flex-direction: column; gap: 14px; }
.journal-day .jr-review { margin-top: 10px; }
.jr-rating { display: flex; align-items: center; gap: 8px; }
.jr-stars { color: var(--warn); letter-spacing: 2px; font-size: 15px; }
.jr-rating-num { color: var(--text-dim); font-size: 13px; }
.jr-section { display: flex; flex-direction: column; gap: 4px; }
.jr-section-label {
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-faint);
}
.jr-section-text {
  font-size: 14px; line-height: 1.5; color: var(--text);
  white-space: pre-wrap; /* preserve the user's line breaks */
}

/* Daily Review — transient save confirmation */
.save-status {
  margin: 10px 0 0; font-size: 13px; color: var(--good);
  opacity: 0; transform: translateY(-2px);
  transition: opacity 0.18s ease, transform 0.18s ease;
  min-height: 18px; /* reserve space so layout doesn't jump */
}
.save-status.is-shown { opacity: 1; transform: translateY(0); }

/* Reading — readable saved notes */
.reading-notes { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px;
  display: flex; flex-direction: column; gap: 6px; }
.reading-notes-head { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); }
.reading-note { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.45; color: var(--text); }
.reading-note-loc { color: var(--text-faint); font-size: 12px; flex: none; }
.reading-note-text { white-space: pre-wrap; }

/* Field hint + error styling for the save-status line */
.field-hint { margin: 6px 0 0; font-size: 12px; color: var(--text-faint); }
.save-status.is-error { color: var(--urgent); opacity: 1; transform: none; }

/* In-app Clear-all-data confirmation (replaces fragile window.confirm) */
.reset-confirm { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.reset-confirm-label { color: var(--urgent); font-size: 13px; font-weight: 550; }
.btn-danger {
  background: var(--urgent); color: #fff; border: 1px solid var(--urgent);
}
.btn-danger:hover { filter: brightness(1.08); }

/* Finished reading item — clean read-only completed card */
.read-item.is-finished { background: var(--surface-2); }
.read-item.is-finished .read-head { align-items: center; gap: 10px; }
.read-head-meta { margin-left: auto; }
.read-finished-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px;
  border-top: 1px solid var(--border); padding-top: 12px; }
.pill-good { background: color-mix(in srgb, var(--good) 20%, transparent);
  border-color: color-mix(in srgb, var(--good) 45%, var(--border)); color: var(--text); }

/* ---- Winter Arc card (Home/Today) ---- */
.winter-arc {
  margin-bottom: 16px;
  padding: 16px 18px;
  border-radius: var(--r-lg, 16px);
  border: 1px solid color-mix(in srgb, #6ea8ff 30%, var(--border));
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, #6ea8ff 16%, transparent) 0%, transparent 55%),
    linear-gradient(180deg, color-mix(in srgb, #7cc4ff 8%, var(--surface-2)) 0%, var(--surface-2) 100%);
}
.wa-top { display: flex; align-items: center; gap: 8px; }
.wa-flake { font-size: 15px; }
.wa-eyebrow {
  font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase;
  color: color-mix(in srgb, #bcd8ff 70%, var(--text-dim)); font-weight: 600;
}
.wa-range { margin-left: auto; color: var(--text-faint); font-size: 12px; }
.wa-headline { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; flex-wrap: wrap; }
.wa-big { font-size: 34px; line-height: 1; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
.wa-unit { font-size: 15px; color: var(--text-dim); font-weight: 500; }
.wa-bar {
  position: relative; height: 10px; border-radius: 999px;
  background: color-mix(in srgb, #6ea8ff 14%, var(--surface));
  overflow: hidden; margin-bottom: 12px;
}
.wa-bar > i {
  position: absolute; inset: 0 auto 0 0; display: block; height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #6ea8ff, #a5d8ff);
  transition: width 0.4s ease;
}
.wa-bar-pct {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-size: 10px; color: var(--text); mix-blend-mode: difference;
}
.wa-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.wa-sub { color: var(--text-dim); font-size: 12px; }
.wa-motto {
  font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
  color: color-mix(in srgb, #bcd8ff 60%, var(--text-faint)); font-weight: 600;
}
.winter-arc.phase-complete {
  border-color: color-mix(in srgb, var(--warn, #f2c14e) 40%, var(--border));
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--warn, #f2c14e) 16%, transparent) 0%, transparent 55%),
    linear-gradient(180deg, color-mix(in srgb, var(--warn, #f2c14e) 8%, var(--surface-2)) 0%, var(--surface-2) 100%);
}
.winter-arc.phase-final .wa-motto { color: color-mix(in srgb, var(--warn, #f2c14e) 80%, var(--text)); }

@media (max-width: 640px) {
  .winter-arc { padding: 14px; }
  .wa-big { font-size: 28px; }
  .wa-range { display: none; } /* keep the top row clean on small screens */
}

/* ---- Weekly Review / Insights ---- */
.week-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.week-nav-label { font-size: 14px; color: var(--text); }
.btn.is-disabled { opacity: 0.4; pointer-events: none; }

.insight-table { display: flex; flex-direction: column; gap: 8px; }
.insight-row { display: grid; grid-template-columns: 1fr auto minmax(80px, 160px) 44px; align-items: center; gap: 10px; }
.insight-row-name { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insight-row-num { color: var(--text-dim); font-size: 13px; text-align: right; }
.insight-row-rate { text-align: right; font-size: 13px; color: var(--text); }
.insight-missed { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.insight-missed-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.insight-missed-name { color: var(--text-dim); }
.insight-missed-days { color: color-mix(in srgb, var(--urgent) 80%, var(--text-dim)); }

.rating-strip { display: flex; gap: 6px; }
.rating-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rating-day-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
.rating-day-val { font-size: 16px; font-weight: 600; color: var(--text);
  width: 100%; text-align: center; padding: 6px 0; border-radius: var(--r-sm); background: var(--surface); }
.rating-day-val.is-empty { color: var(--text-faint); font-weight: 400; background: transparent; }
.rating-avg { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
.rating-avg .mono { font-size: 18px; font-weight: 600; }

.theme-list { display: flex; flex-direction: column; gap: 6px; }
.theme-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface); font-size: 14px; }
.theme-row.theme-bad .theme-name { color: color-mix(in srgb, var(--urgent) 75%, var(--text)); }
.theme-row.theme-good .theme-name { color: color-mix(in srgb, var(--good) 75%, var(--text)); }
.theme-count { color: var(--text-faint); font-size: 12px; }

.learned-list { display: flex; flex-direction: column; gap: 10px; }
.learned-row { display: flex; gap: 12px; }
.learned-day { flex: none; width: 64px; font-size: 12px; color: var(--text-faint); padding-top: 1px; }
.learned-text { font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; }

.compare-table { display: flex; flex-direction: column; gap: 4px; }
.compare-row { display: grid; grid-template-columns: 1fr 64px 64px 28px; align-items: center; gap: 8px; padding: 6px 0; }
.compare-row.compare-head { color: var(--text-faint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
.compare-label { font-size: 14px; color: var(--text); }
.compare-cur, .compare-prev { text-align: right; font-size: 14px; }
.compare-prev { color: var(--text-dim); }
.compare-arrow { text-align: center; font-weight: 700; }
.arrow-up { color: var(--good); }
.arrow-down { color: var(--urgent); }
.arrow-flat { color: var(--text-faint); }

/* Home — compact recent-performance strip */
.perf-strip { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.perf-item { display: flex; flex-direction: column; }
.perf-val { font-size: 18px; font-weight: 700; color: var(--text); font-family: var(--mono, monospace); }
.perf-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.perf-cta { margin-left: auto; }

@media (max-width: 640px) {
  .insight-row { grid-template-columns: 1fr auto 44px; }
  .insight-row-bar { display: none; }
  .learned-row { flex-direction: column; gap: 2px; }
  .learned-day { width: auto; }
}

/* ---- Attention needed ---- */
.attention-list { display: flex; flex-direction: column; gap: 8px; }
.attention-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface); font-size: 14px; }
.attention-row.sev-warn { border-left: 3px solid var(--urgent); }
.attention-row.sev-info { border-left: 3px solid color-mix(in srgb, var(--accent) 60%, var(--border)); }
.attention-dot { flex: none; font-size: 11px; }
.attention-row.sev-warn .attention-dot { color: var(--urgent); }
.attention-row.sev-info .attention-dot { color: var(--accent); }
.attention-msg { color: var(--text); line-height: 1.45; }

/* ---- Weekly scorecard ---- */
.scorecard-overall { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.scorecard-big { font-size: 30px; font-weight: 700; color: var(--text); }
.scorecard-verdict { font-size: 14px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
.scorecard-extremes { margin-left: auto; font-size: 12px; }
.scorecard-areas { display: flex; flex-direction: column; gap: 6px; }
.scorecard-row { display: grid; grid-template-columns: 110px 48px 1fr; align-items: baseline; gap: 10px; }
.scorecard-area-label { font-size: 14px; color: var(--text); }
.scorecard-area-score { text-align: right; font-size: 14px; color: var(--text); font-weight: 600; }
.scorecard-area-detail { font-size: 12px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 640px) {
  .scorecard-row { grid-template-columns: 90px 44px 1fr; }
  .scorecard-extremes { margin-left: 0; width: 100%; }
}

/* ---- Goal intelligence panel ---- */
.gi-section .goal-section-head { align-items: center; }
.gi-status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 2px 8px; border-radius: 999px; margin-left: auto; }
.gi-ahead { color: var(--good); background: color-mix(in srgb, var(--good) 18%, transparent); }
.gi-on_track { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.gi-behind { color: var(--urgent); background: color-mix(in srgb, var(--urgent) 18%, transparent); }
.gi-complete { color: var(--good); background: color-mix(in srgb, var(--good) 22%, transparent); }
.gi-unknown { color: var(--text-faint); background: var(--surface); }
.gi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.gi-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.gi-label { color: var(--text-dim); }
.gi-val { color: var(--text); }

/* ---- Bodyweight trend chart (SVG) ---- */
.bw-summary { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; }
.bw-stat { display: flex; flex-direction: column; }
.bw-stat-val { font-size: 18px; font-weight: 700; color: var(--text); font-family: var(--mono, monospace); }
.bw-stat-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; }
.bw-chart { width: 100%; height: auto; display: block; }
.bw-chart .bw-line { fill: none; stroke: var(--accent); stroke-width: 2; }
.bw-chart .bw-goal { stroke: color-mix(in srgb, var(--good) 60%, var(--border)); stroke-width: 1; stroke-dasharray: 4 4; }
